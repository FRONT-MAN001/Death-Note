name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore & Assemble Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/release.keystore"
          if [ -n "$SIGNING_KEY" ]; then
            echo "==> Decoding production SIGNING_KEY from GitHub Secrets..."
            echo "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
          else
            echo "==> Notice: SIGNING_KEY secret is not set in GitHub Repository Secrets."
            echo "==> Initializing fallback signing keystore for continuous integration build..."
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > "$KEYSTORE_FILE"
            else
              keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            fi
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export KEY_STORE_PASSWORD="android"
            export ALIAS="androiddebugkey"
            export KEY_PASSWORD="android"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: death-note-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
